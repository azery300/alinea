name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alinea
          POSTGRES_PASSWORD: alinea
          POSTGRES_DB: alinea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinea -d alinea"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://alinea:alinea@localhost:5432/alinea
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: make lint
      - run: make test
