[project]
name = "alinea"
version = "0.1.0"
description = "Agentic RAG assistant for the French Labor Code, with cited answers and refusals"
readme = "README.md"
license = "MIT"
authors = [{ name = "Adam Britel" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the Postgres + pgvector database (make db-up)",
    "slow: end-to-end tests that call external models",
]
